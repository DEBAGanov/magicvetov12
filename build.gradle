plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.baganov'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring основные зависимости
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // S3 клиент
    implementation 'io.minio:minio:8.5.9'

    // БД
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2' // H2 база для тестирования

    // H2 для тестов
    testRuntimeOnly 'com.h2database:h2'

    // Утилиты
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // OpenAPI / Swagger UI - простая стандартная конфигурация
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Resilience4j для отказоустойчивости
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-timelimiter:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Разработка
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Тесты
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'jakarta.mail:jakarta.mail-api'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.eclipse.angus:angus-mail:2.0.1'

    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'jakarta.mail:jakarta.mail-api'

    // Spring Retry для механизма повторных попыток
    implementation 'org.springframework.retry:spring-retry'

    // Обработка загружаемых изображений (ImageUploadService).
    // thumbnailator — ресайз с сохранением пропорций и поворотом по EXIF:
    // фото с телефона иначе уезжают на бок.
    //
    // Кодировщика WebP здесь намеренно нет. Все доступные реализации
    // (com.github.gotson, org.sejda) — обёртки над нативной libwebp через JNI и
    // не содержат бинарника под macOS ARM64: проверено, падают с
    // UnsatisfiedLinkError на машине разработчика. Пригодного чисто-Java
    // кодировщика на Maven Central нет (twelvemonkeys:imageio-webp умеет только
    // чтение — в нём нет ImageWriterSpi).
    // Поэтому пишем JPEG средствами встроенного ImageIO: основной выигрыш даёт
    // ресайз 4000→1600 px, а витрине WebP/AVIF всё равно раздаёт Next.js через
    // /_next/image. См. docs/Diary.md, запись от 2026-10-01.
    implementation 'net.coobird:thumbnailator:0.4.20'

    // AWS SDK
    implementation platform('software.amazon.awssdk:bom:2.25.1')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'

    // Telegram Bot API
    implementation 'org.telegram:telegrambots-spring-boot-starter:6.8.0'

    // ЮKassa интеграция
    // WebFlux уже добавлен выше
    // Метрики для мониторинга платежей
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Google Sheets API интеграция
    implementation 'com.google.apis:google-api-services-sheets:v4-rev612-1.25.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.19.0'
    implementation 'com.google.auth:google-auth-library-credentials:1.19.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'
}

tasks.named('test') {
    useJUnitPlatform()
    // Пропускаем тесты при сборке, пока они не настроены правильно
    enabled = false
}

/**
 * Проверка правил доступа (SecurityConfigRulesTest).
 *
 * Отдельная задача, потому что основной `test` выключен целиком, а эти правила
 * ломаются незаметно: приложение стартует, витрина работает, а админский API
 * открыт всем. Запуск: ./gradlew securityTest
 */
tasks.register('securityTest', Test) {
    description = 'Проверяет правила доступа Spring Security (дефекты S1-S3)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.baganov.magicvetov.config.SecurityConfigRulesTest'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

/**
 * Проверка приёма загружаемых изображений (ImageUploadServiceTest).
 *
 * Отдельная задача по той же причине, что и securityTest: основной `test`
 * выключен, а регрессия здесь не видна снаружи — форма работает, файл
 * «загрузился», просто в бакет уехал переименованный .exe.
 * Запуск: ./gradlew uploadTest
 */
tasks.register('uploadTest', Test) {
    description = 'Проверяет загрузку изображений, правку галереи и удаление файлов из S3'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.baganov.magicvetov.service.ImageUploadServiceTest'
        includeTestsMatching 'com.baganov.magicvetov.service.AdminProductServiceTest'
        includeTestsMatching 'com.baganov.magicvetov.service.StorageServiceUrlTest'
        includeTestsMatching 'com.baganov.magicvetov.service.AdminCategoryServiceTest'
        includeTestsMatching 'com.baganov.magicvetov.model.dto.AdminDtoSerializationTest'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

tasks.named('bootRun') {
    // Добавляем профиль "dev" для локального запуска
    systemProperty 'spring.profiles.active', 'dev'
}

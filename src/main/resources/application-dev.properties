# Профиль разработки
spring.config.activate.on-profile=dev

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/magicvetov_db
spring.datasource.username=magicvetov_user
spring.datasource.password=strong_password_change_me
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Расширенное логирование
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.baganov.magicvetov=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Настройки сервера
server.port=8080
server.address=0.0.0.0

# Раньше здесь стояло app.security.disable-jwt-auth=true — режим, полностью
# отключавший аутентификацию в dev. Из-за него админский API (в том числе
# загрузка файлов в S3) был открыт анонимно, и разработка шла в условиях,
# непохожих на прод. Режим убран вместе с флагом, см. SecurityConfig.
# Ключ app.security.jwt.skip-auth-urls тоже удалён: его никто не читал.

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MinIO
s3.access-key=accesskey
s3.secret-key=secretkey
s3.endpoint=http://localhost:9000
s3.public-url=http://localhost:9000
s3.bucket=magicvetov 